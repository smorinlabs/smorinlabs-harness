name: Muse manual fix PR

on:
  workflow_dispatch:
    inputs:
      request:
        description: Bounded fix to implement on a new branch from the default branch
        required: true
        type: string

permissions: {}

concurrency:
  group: muse-fix-${{ github.repository }}
  cancel-in-progress: false

jobs:
  fix:
    if: >-
      vars.MUSE_CI_ENABLED == 'true' &&
      github.event.repository.owner.type == 'Organization' &&
      github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Check out requested default-branch commit
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Authorize members and prepare restricted fix profile
        id: prepare
        run: python3 .github/scripts/muse_ci.py prepare fix
        env:
          GH_TOKEN: ${{ github.token }}
          MUSE_MEMBERS_TOKEN: ${{ secrets.MUSE_CI_GITHUB_MEMBERS_TOKEN }}
          MUSE_TRIGGERING_ACTOR: ${{ github.triggering_actor }}
      - name: Check Meta credential is configured
        run: test -n "$META_MUSE_CI_API_KEY"
        env:
          META_MUSE_CI_API_KEY: ${{ secrets.META_MUSE_CI_API_KEY }}
      - name: Create a fix PR with Muse Spark
        uses: anomalyco/opencode/github@a97622c801f4ca571530ddc51076af659a9c32cd # v1.18.31 action; CLI installer moves
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GH_TOKEN: ${{ github.token }}
          META_MUSE_CI_API_KEY: ${{ secrets.META_MUSE_CI_API_KEY }}
          GIT_AUTHOR_NAME: github-actions[bot]
          GIT_AUTHOR_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
          GIT_COMMITTER_NAME: github-actions[bot]
          GIT_COMMITTER_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
        with:
          model: model_api/muse-spark-1.3-contributor
          agent: muse-fix
          share: "false"
          use_github_token: "true"
          prompt: ${{ steps.prepare.outputs.prompt }}
      - name: Check fix branch and protected paths
        if: always() && steps.prepare.outcome == 'success'
        run: python3 "$MUSE_CI_HELPER" finish fix
        env:
          GH_TOKEN: ${{ github.token }}
