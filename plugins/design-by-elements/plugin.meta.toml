name = "design-by-elements"
version = "0.1.0"
description = "Iterative, element-by-element method for prototyping the visual or textual form of an artifact — terminal output, report and CLI layouts, table designs, page and email mockups — before building it: decompose into lockable elements, settle meaning before form, contrast opposed variants, lock with rationale, and promote every fix into a named rule"
author = "Steve Morin"
keywords = ["design", "prototyping", "layout", "format", "elements", "decisions-log", "principles", "process"]

