name = "clear-decision-communication"
version = "0.1.0"
description = "Decision requests from an agent to a human during a run, as inline ASCII text. Gates whether a new decision is needed at all (facts are looked up, authorization persists, the question must be sharp), sizes the ask by seven diagnostic axes into three tiers so preparation and depth match the highest single axis, picks the representation from the change type (same-input table, worked example, event sequence, coded ASCII system diagram), and renders a six-question brief: the decision and recommendation first, then context, comparison, consequences with inspectable evidence, and the exact action approval authorizes. Questions are numbered and options lettered so replies can be one word; the recommended option is always A and says when the runner-up would win; every option names its consequence; a silence default is always the most reversible option. Delivered as canonical plain text with a derived dialog rendering, the brief ending its turn before any dialog opens; conditions, skips, redirects, and ask-backs are handled; significant decisions get a record keyed by the question ID. Self-contained: synthesizes a decision-communication framework with clear-technical-communication rules and show-me forms; never produces HTML."
author = "Steve Morin"
keywords = ["decisions", "communication", "agentic", "approval", "decision-brief", "progressive-disclosure", "askuserquestion", "plain-text"]

[interface]
displayName = "Clear Decision Communication"
category = "Developer Tools"
