name = "session"
version = "0.11.0"
description = "Session-state quintet for coding sessions: session-recap orients when returning to one (arc, done/open, git/PR/worktree state, ranked next steps, close-or-continue verdict — strictly read-only); session-loose-ends is its acting sibling — sweeps working-state artifacts, processes, unfulfilled promises, and tracking drift, reports each with evidence and a keep-or-clean recommendation both ways, then executes and verifies only what was confirmed item by item; session-handoff faces forward — it packages the current session into a self-contained, machine-portable handoff (outcome, repo identity, resume state, and the tacit context that dies on compaction) for a fresh zero-context session to pick up cold; session-status is the mid-flight glance — a manually-triggered, plain-language progress map of the active stream (done rolled up, what's left fine-grained where you stand), probe-free and read-only; session-agent-list finds and lists Claude Code and Codex sessions across the machine as action-ready cards — end-state triage (open / handed off / closed clean / loose ends), lineage, and copy-paste resume or transcript commands."
author = "Steve Morin"
keywords = ["session", "recap", "orient", "resume", "status", "pr", "worktree", "git", "loose-ends", "cleanup", "handoff", "portability", "progress", "list", "find", "codex", "discovery"]

[interface]
displayName = "Session"
category = "Developer Tools"
