name: Windows smoke job

on:
  workflow_call:
    inputs:
      runner_labels:
        type: string
        required: true
      expected_architecture:
        type: string
        required: true
      report_name:
        type: string
        required: true

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ${{ fromJSON(inputs.runner_labels) }}
    timeout-minutes: 10
    steps:
      - name: Check out the exact test commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Exercise Windows and record its environment
        shell: pwsh
        env:
          SMOKE_EXPECTED_ARCHITECTURE: ${{ inputs.expected_architecture }}
        run: ./scripts/windows-smoke.ps1 -ExpectedArchitecture $env:SMOKE_EXPECTED_ARCHITECTURE
      - name: Preserve the compatibility report
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ inputs.report_name }}
          path: artifacts/windows-smoke.json
          if-no-files-found: error
          retention-days: 14
